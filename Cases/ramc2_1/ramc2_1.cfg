%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Mach 15 viscous, ionized flow over a cylinder              %
%                   using the Gupta-Yos transport model.                       %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= NEMO_RANS
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
AXISYMMETRIC= YES
KIND_TURB_MODEL= SST
SST_OPTIONS=COMPRESSIBILITY-WILCOX, SUSTAINING, DIMENSIONLESS_LIMIT

% ----------- COMPRESSIBLE AND INCOMPRESSIBLE FREE-STREAM DEFINITION ----------%
%
MACH_NUMBER=23.9
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 19.7
FREESTREAM_TEMPERATURE= 254.0
FREESTREAM_TEMPERATURE_VE= 254.0
INIT_OPTION=TD_CONDITIONS



%FREESTREAM_TURBULENCEINTENSITY= 0.05
%FREESTREAM_TURB2LAMVISCRATIO= 10

% ---- NONEQUILIBRIUM GAS, IDEAL GAS, POLYTROPIC, VAN DER WAALS AND PENG ROBINSON CONSTANTS -------%
%
FLUID_MODEL= SU2_NONEQ
GAS_MODEL= AIR-11
SPECIES_CLIPPING= YES
SPECIES_CLIPPING_MIN= 1e-30
GAS_COMPOSITION= (1.0e-30, 0.767, 0.233, 1.0e-30, 1.0e-30, 1.0e-30, 1.0e-30, 1.0e-30, 1.0e-30, 1.0e-30, 1.0e-30)
%GAS_COMPOSITION= (1.0e-30, 0.767, 0.233, 1.0e-30, 1.0e-30, 1.0e-30, 1.0e-30)
TRANSPORT_COEFF_MODEL= GUPTA-YOS

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_ISOTHERMAL=(wall, 1500.0)
MARKER_FAR= (farfield)
MARKER_INLET_TURBULENT= (farfield, 0.01, 10.0)
MARKER_SYM= (axis)
MARKER_PLOTTING= (wall)
MARKER_MONITORING= (wall)

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 0.02
ITER= 500000
LINEAR_SOLVER= BCGSTAB
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 5

% -----------------------------------------------------------------------%
%
%CONV_NUM_METHOD_TURB= SCALAR_UPWIND
CONV_NUM_METHOD_FLOW= AUSM
MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.01
TIME_DISCRE_FLOW= EULER_EXPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -15
CONV_STARTITER= 10

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= ramc2_7.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= restart_flow_gy 
RESTART_FILENAME= restart_flow_gy 
TABULAR_FORMAT= TECPLOT
CONV_FILENAME= convergence
VOLUME_FILENAME= soln_volume
SURFACE_FILENAME= soln_surface     
OUTPUT_WRT_FREQ= 10
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY_0, RMS_DENSITY_1, RMS_DENSITY_2, RMS_DENSITY_3, RMS_DENSITY_4, RMS_DENSITY_5, RMS_DENSITY_6, RMS_ENERGY, RMS_ENERGY_VE, LIFT, DRAG, TOTAL_HEATFLUX
